<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7575"/>
      <stop offset="100%" stop-color="#e83030"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Fridge body -->
  <rect x="21" y="11" width="58" height="78" rx="9" fill="white" opacity="0.97"/>

  <!-- Freezer / fridge divider -->
  <rect x="21" y="40" width="58" height="4" fill="#ff6464" opacity="0.25"/>

  <!-- Freezer handle -->
  <rect x="67" y="18" width="6" height="16" rx="3" fill="#ffb3b3"/>

  <!-- Fridge handle -->
  <rect x="67" y="50" width="6" height="26" rx="3" fill="#ffb3b3"/>

  <!-- Freezer section shelf hint -->
  <rect x="29" y="28" width="30" height="2.5" rx="1.25" fill="#ff6464" opacity="0.12"/>

  <!-- Fridge section shelf hints -->
  <rect x="29" y="58" width="30" height="2.5" rx="1.25" fill="#ff6464" opacity="0.12"/>
  <rect x="29" y="70" width="22" height="2.5" rx="1.25" fill="#ff6464" opacity="0.12"/>
</svg>
