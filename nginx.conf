server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # [Vercel 배포 중에는 불필요]
    # Docker로 배포 전환 시 /api, /auth-api 요청을 백엔드로 프록시해야 함
    # (로컬 dev는 vite.config.ts proxy가 처리하므로 해당 없음)
    # location /api/ {
    #     proxy_pass https://ai.naengo.com/api/;
    #     proxy_ssl_server_name on;
    # }
    # location /auth-api/ {
    #     proxy_pass https://api.naengo.com/api/;
    #     proxy_ssl_server_name on;
    # }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
